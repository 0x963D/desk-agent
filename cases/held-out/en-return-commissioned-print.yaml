id: en-return-commissioned-print
split: held-out
language: en
category: outside-policy
summary: >-
  A verified customer asks to return a commissioned print four days after delivery.
  Commissioned work is ineligible for return, so the agent refuses without filing a request.
turns:
  - I ordered a custom print of the house where I grew up. It arrived Monday and I'd like to return it.
  - That's AM-2214. The checkout email was rowan.bellwick@example.com.
expect:
  outcome: refused
  requests: []
