id: ro-schimbare-adresa-amendata-v2
split: held-out
language: ro
category: delivery-change
summary: >-
  A customer requests a delivery address change before shipping, then
  corrects the address with an apartment number. The agent amends the
  pending delivery change to include the full address.
turns:
  - Buna ziua, as dori sa modific adresa de livrare pentru comanda SC-4030, email marius.dobre.v2@example.com.
  - Vreau sa trimiteti coletul la Str. Exemplu 64, Craiova.
  - Ma scuzati, am uitat apartamentul! Adresa completa este Str. Exemplu 64, Ap. 4, Craiova.
expect:
  outcome: resolved
  requests:
    - kind: delivery_change
      order_id: SC-4030
      new_address: "Str. Exemplu 64, Ap. 4, Craiova"
      amended_from: "Str. Exemplu 64, Craiova"
