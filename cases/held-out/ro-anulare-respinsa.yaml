id: ro-anulare-respinsa
split: held-out
language: ro
category: outside-policy
summary: >-
  A customer asks to cancel an order that is already in production and then
  disagrees with that rule. Cancellation is no longer possible, and disagreeing
  is not a complaint, so the agent refuses and files nothing.
turns:
  - "vreau sa anulez comanda SC-3607. mailul e vlad.enache@example.com, nu mai am nevoie de ea"
  - "stiu ca se poate anula doar inainte de productie, dar abia am platit. va rog sa anulati comanda oricum"
expect:
  outcome: refused
  requests: []
