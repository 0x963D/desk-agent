id: ro-dauna-amendata-refuz-politica-v2
split: held-out
language: ro
category: damage
summary: >-
  A customer reports damage to a 1,250 lei print within the damage window and
  asks for a reprint, so the agent files the claim. The customer later asks for
  a refund instead, which staff must decide because it exceeds 1,000 lei. The
  agent hands over and the pending reprint remains on file.
turns:
  - Salut, am primit coletul pentru comanda SC-4100, dar printul a sosit zgariat pe mijloc.
  - Emailul meu este radu.popa.v2@example.com. Va rog sa inregistrati o cerere de retiparire.
  - Cat dureaza in mod normal productia unui print?
  - Printul era pentru un cadou, dar acum ma gandesc sa aleg altceva.
  - Zgarietura trece chiar prin mijlocul imaginii si se vede de la distanta.
  - M-am razgandit. In locul retiparirii, vreau banii inapoi pe card pentru printul deteriorat.
expect:
  outcome: handed_over
  handover_reason: staff_decision
  requests:
    - kind: damage
      order_id: SC-4100
      remedy: reprint
