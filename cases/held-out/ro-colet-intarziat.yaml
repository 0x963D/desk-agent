id: ro-colet-intarziat
split: held-out
language: ro
category: order-status
summary: >-
  An impatient customer asks where a shipped order is and asks for the tracking
  link. The customer gives the order number and the email on the order, so the
  agent gives the status and the link. Impatience is not a complaint, and the
  agent answers it itself.
turns:
  - "buna, a trecut o saptmana si coletul nu a ajuns. unde e?"
  - "comanda SC-3041, mail mihai.dobre@example.com. vreau linkul de tracking, nu mai am chef sa astept"
expect:
  outcome: resolved
  requests: []
  reply_mentions:
    - https://curier.example/track/SC3041
