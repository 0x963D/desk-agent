id: en-address-change-already-shipped-v2
split: held-out
language: en
category: delivery-change
summary: >-
  A customer asks to change the delivery address for an order that has already
  shipped. Because policy forbids address changes after shipping, the agent
  hands over for a staff decision.
turns:
  - Hello, I moved today and need to update the delivery address for my order.
  - The order number is SC-4040 and my email is george.miller.v2@example.com. New address is Str. Exemplu 63, Timisoara.
expect:
  outcome: handed_over
  handover_reason: staff_decision
  requests: []
