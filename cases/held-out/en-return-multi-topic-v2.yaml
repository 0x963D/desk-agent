id: en-return-multi-topic-v2
split: held-out
language: en
category: person-needed
summary: >-
  A customer asks to return an open print delivered six days ago, so the agent
  files the return for staff approval. The customer also asks about production
  and switches to Romanian to request a tattoo booking, which goes to the
  artist while the return stays on file.
turns:
  - Hello, I received a print last week but the colors do not match my room. I would like to return it.
  - My order is SC-4060 and the email used is liam.fletcher.v2@example.com. Please file the return request.
  - Separate question. How many working days does print production usually take?
  - Revin la printul meu. Cine plateste transportul pentru retur?
  - I still want to return order SC-4060. I can cover the return shipping.
  - Mai am o intrebare pentru artista. As vrea sa ma programez pentru un tatuaj cu o frunza pe incheietura, de vreo 4 cm. Pot veni sambata dimineata.
expect:
  outcome: handed_over
  handover_reason:
    - commission_or_booking
    - customer_asked
  requests:
    - kind: return
      order_id: SC-4060
