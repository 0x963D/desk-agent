id: en-cancel-paid-order-v2
split: held-out
language: en
category: inside-policy
summary: >-
  A customer cancels an order that is paid and has not yet started production.
  The agent files the cancellation for staff approval.
turns:
  - Hi, I placed an order recently but bought the wrong size. I want to cancel it.
  - Order SC-4050, email sarah.jenkins.v2@example.com. Please cancel the order.
expect:
  outcome: resolved
  requests:
    - kind: cancellation
      order_id: SC-4050
