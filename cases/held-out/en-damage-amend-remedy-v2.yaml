id: en-damage-amend-remedy-v2
split: held-out
language: en
category: damage
summary: >-
  A customer reports damage within the 14-day window and asks for a refund
  below the staff handover threshold. When they switch to a reprint, the
  agent amends the pending claim and leaves it with staff for approval.
turns:
  - Hello, I just opened my delivery and the print has a deep crease along the corner.
  - Order SC-4090, email is emily.clark.v2@example.com. Please file a damage claim for a refund.
  - Actually, I really love the art itself. Could I please get a reprint instead of a refund?
expect:
  outcome: resolved
  requests:
    - kind: damage
      order_id: SC-4090
      remedy: reprint
      amended_from: refund
