id: ro-retur-comanda-speciala-v2
split: held-out
language: ro
category: outside-policy
summary: >-
  A customer asks to return a commissioned portrait, which shop policy
  forbids. The customer also asks about payment for future orders and
  eventually asks to speak with staff about the return.
turns:
  - Buna ziua! Am primit lucrarea comandata saptamana trecuta, dar as dori sa fac un retur.
  - Comanda este SC-4080 si adresa de email diana.moraru.v2@example.com.
  - Separat, magazinul accepta si plata ramburs pentru alte produse?
  - Intreb pentru o comanda viitoare. Ma gandesc sa iau un print din catalog.
  - Revenind la comanda mea SC-4080 cu portretul personalizat, va rog sa inregistrati returul.
  - Doresc sa vorbesc cu o persoana sau un coleg din echipa despre aceasta comanda.
expect:
  outcome: handed_over
  handover_reason: customer_asked
  requests: []
