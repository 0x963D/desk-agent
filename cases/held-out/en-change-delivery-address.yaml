id: en-change-delivery-address
split: held-out
language: en
customer_id: C-1004
summary: >-
  A customer wants an order that has not shipped sent to a different address.
  The agent files a delivery-change request for a colleague to approve.
turns:
  - >-
    Hi, order EX-1004 has not left your warehouse yet. Can you deliver it to
    Strada Exemplu 9, Cluj-Napoca instead?
expect:
  outcome: resolved
  requests:
    - kind: delivery_change
      order_id: EX-1004
