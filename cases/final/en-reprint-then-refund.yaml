id: en-reprint-then-refund
split: final
language: en
category: damage
summary: A verified customer asks for a reprint after receiving a damaged 1,320 lei limited print, asks about restocks, then asks to change the remedy to a refund. A reprint is allowed, but a refund above 1,000 lei is not, so the amendment is refused, the reprint stays on file, and the agent hands over for a staff decision.
turns:
  - Hello. The limited print arrived creased. I want a reprint, not my money back.
  - Order SC-5221, email valeska.taranu@example.com. Delivery was within the last two weeks.
  - Please file the damage claim with a reprint. I can send a photo to the team.
  - "One side question: are limited drops ever restocked? Answer that, then I will come back to the claim."
  - I have changed my mind. I want a full refund for the damaged print. If the claim is already on file for a reprint, please change its remedy to a refund.
  - Keep it as a damage claim on SC-5221. I am not opening a return, and I am not asking you to approve the money yourself.
expect:
  outcome: handed_over
  handover_reason: staff_decision
  requests:
    - kind: damage
      order_id: SC-5221
      remedy: reprint
