summary: A verified customer asks to return a limited print delivered nine days ago. The return window is open, but the total is 1,450 lei, so a person decides the refund. The agent hands over for that staff decision and files nothing.
turns:
  - Bună ziua. Vreau să returnez printul din ediția limitată. Este prea scump pentru peretele meu.
  - Comanda este SC-5217. A fost livrată de curând.
  - "O întrebare despre comenzi viitoare: plata se face doar cu cardul?"
  - Revin la retur. Vreau să returnez printul și plătesc eu transportul.
  - Vreau rambursarea integrală pe card.
  - Emailul pentru comanda SC-5217 este luxandra.pistrui@example.com. Comanda a costat peste o mie de lei.
expect:
