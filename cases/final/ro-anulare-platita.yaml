id: ro-anulare-platita
split: final
language: ro
category: inside-policy
summary: >-
  A customer cancels an order that is still only paid, so production has not
  started. The refund is within the amount the agent may file, and the agent
  files the cancellation for staff approval.
turns:
  - "Bună ziua, aș vrea să anulez o comandă care este doar plătită, vă rog."
  - "Numărul este SC-3402, iar e-mailul este ioana.petrescu@example.com. Am ales mărimea greșită."
expect:
  outcome: resolved
  requests:
    - kind: cancellation
      order_id: SC-3402
