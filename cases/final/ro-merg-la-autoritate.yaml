id: ro-merg-la-autoritate
split: final
language: ro
category: person-needed
summary: A verified customer asks where a shipped order is, asks whether cash on delivery exists, then says they will take the delay to the consumer authority and to their bank. That is a complaint, so the agent hands over and files nothing.
turns:
  - Bună ziua. Coletul întârzie și sunt foarte supărată. Vreau să știu unde este.
  - Comanda SC-5233, email quillon.salbaticu@example.com. Nu cer încă o rambursare.
  - Apropo, se poate plăti ramburs la curier pentru o comandă viitoare? Răspundeți la asta, apoi revin la colet.
  - Revin la comanda SC-5233. Întârzierea mi se pare prea mare și vreau un răspuns despre colet.
  - Dacă nu rezolvați azi, merg la Autoritatea Națională pentru Protecția Consumatorilor și scriu și băncii.
  - Nu vreau o cerere de retur. Vreau să rămână notat că duc cazul la autoritatea de protecție a consumatorilor și la bancă.
expect:
  outcome: handed_over
  handover_reason: complaint
