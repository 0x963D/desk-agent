id: ro-adresa-noua-inainte
split: final
language: ro
category: delivery-change
summary: >-
  A customer changes the delivery address of an order that is still in
  production. The change is allowed until the order ships, so the agent files
  it for staff approval with the new address the customer gave.
turns:
  - "salut, vreau sa schimb adresa de livrare inainte sa plece comanda"
  - "comanda e SC-3215 si mailul e andrei.popa@example.com. noua adresa e Str. Exemplu 15, Oradea, va rog"
expect:
  outcome: resolved
  requests:
    - kind: delivery_change
      order_id: SC-3215
      new_address: Str. Exemplu 15, Oradea
