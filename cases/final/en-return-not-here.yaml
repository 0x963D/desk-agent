id: en-return-not-here
split: final
language: en
category: outside-policy
summary: A verified customer asks to return an order that has shipped but not been delivered, and also asks for help with a tax form. A return needs a delivery, and the shop does not do tax work, so the agent refuses and files nothing.
turns:
  - Hello. I want to return order SC-5216. The email is thymele.jderescu@example.com.
  - The parcel has not reached me yet. I changed my mind.
  - Also, can you help me fill in my tax return for last year? It has nothing to do with the shop, but I am stuck on the form.
  - Back to the order. Please file the shop return. I am not threatening anyone.
expect:
  outcome: refused
