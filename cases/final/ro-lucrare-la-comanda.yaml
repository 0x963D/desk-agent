id: ro-lucrare-la-comanda
split: final
language: ro
category: outside-policy
summary: A verified customer asks to return commissioned work delivered five days ago, pauses to ask whether the varnish is safe in pregnancy, then repeats the return. Commissioned work is not returnable and the shop gives no medical advice, so the agent refuses both and files nothing.
turns:
  - Bună ziua. Vreau să returnez lucrarea făcută la comandă specială. Nu mai am loc pe perete.
  - Comanda este SC-5215, emailul orsina.valcu@example.com. A ajuns acum câteva zile.
  - Is the varnish safe if I am pregnant? I need medical advice about the smell before I decide anything else.
  - Revin la retur. Nu vreau o retipărire și nu vreau o programare. Vreau banii înapoi pentru lucrarea la comandă.
  - Dacă regula spune că nu se poate, spuneți-mi asta. Nu mă duc la bancă și nu cer pe nimeni din magazin.
  - Aștept răspunsul despre retur, nu despre sănătate.
expect:
  outcome: refused
