id: ro-remediu-schimbat
split: final
language: ro
category: damage
summary: A verified customer requests a reprint for a damaged print, asks how long production takes, then changes the remedy to a refund. The claim is inside the damage window and the 420 lei total is under the refund limit, so the agent amends it to a refund for staff approval.
turns:
  - Bună ziua. Printul a venit cu o tăietură în hârtie. Vreau o retipărire.
  - Comanda SC-5220, emailul osric.fainarescu@example.com. Livrarea a fost în ultimele două săptămâni.
  - Am o fotografie pentru echipă. Înregistrați dauna cu retipărire, vă rog.
  - Apropo, cât durează producția unui print nou, în zile lucrătoare? Doar atât, apoi revin.
  - Revin la cerere. Nu mai vreau retipărirea. Vreau banii înapoi pentru același print deteriorat.
  - Dacă ați înregistrat deja cererea cu retipărire, schimbați remediul în rambursare. Nu schimbați adresa și nu anulați nimic altceva.
  - Suma este sub o mie de lei. Îmi confirmați că ați trecut rambursarea pe cererea de daună și că urmează să o aprobe echipa?
expect:
  outcome: resolved
  requests:
    - kind: damage
      order_id: SC-5220
      remedy: refund
      amended_from: reprint
