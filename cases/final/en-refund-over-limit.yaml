id: en-refund-over-limit
split: final
language: en
category: outside-policy
summary: >-
  A customer asks to return a limited print for a refund, and the order total
  is above 1,000 lei. A person decides that refund, so the agent hands over and
  files nothing. The second message completes the need.
turns:
  - "Hello, I want to return a print and get the money back."
  - "The order is SC-3744 and the email is claire.fontaine@example.com."
  - "I do want that refund, for the reason I gave."
expect:
  outcome: handed_over
  handover_reason: staff_decision
  requests: []
