id: ro-adresa-expediata
split: final
language: ro
category: delivery-change
summary: A verified customer asks to move the delivery address of an order that has already shipped. The address can no longer change, so the agent hands the conversation to a person for that staff decision and files nothing.
turns:
  - Bună ziua. Curierul a plecat deja, dar aș vrea totuși să mut livrarea la altă adresă.
  - Comanda este SC-5208, emailul wystan.hribovan@example.com. Vă rog să schimbați adresa de livrare în Strada Nucului 4, Iasi, dacă se mai poate.
  - Nu vreau rambursare. Vreau doar să mut livrarea, chiar dacă a plecat deja coletul.
expect:
  outcome: handed_over
  handover_reason: staff_decision
