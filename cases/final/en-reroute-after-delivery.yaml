id: en-reroute-after-delivery
split: final
language: en
category: delivery-change
summary: A verified customer asks to redirect a print that was already delivered. The address can no longer change after shipment, so the agent hands over for a staff decision and files nothing.
turns:
  - Hi. The print was delivered to the old flat. I'd like to change the delivery address on that order now.
  - Order SC-5209, email cressida.paunelu@example.com. The new delivery address would be Lindenweg 9, Graz.
  - I do not want a return. I only want the delivery address updated after delivery.
expect:
  outcome: handed_over
  handover_reason: staff_decision
