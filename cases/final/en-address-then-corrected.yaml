id: en-address-then-corrected
split: final
language: en
category: delivery-change
summary: A verified customer asks to change the address of an order still in production, asks whether a limited drop can be reserved, then corrects the address. The agent keeps a single delivery change with the corrected address and does not reserve a limited print.
turns:
  - Hello. I need the delivery address changed before the print ships. Production can keep going.
  - Order SC-5207, email pelagia.zarnescu@example.com. Please file the change to this address exactly as written, on one line. Piata Linistii 2, Sibiu
  - Un moment, o alta intrebare. Printurile din editiile limitate se mai fabrica sau pot rezerva unul pentru sora mea?
  - Back to the parcel. Please ignore the Sibiu address. The only address that should be on the request, as one line, is Aleea Greierului 11, Bacau
  - I am not asking for a refund or a cancellation. Only the delivery address, and only that last line.
  - If you already filed the Sibiu one, change it to Aleea Greierului 11, Bacau and leave the rest of the order as it is.
  - Could you confirm that the corrected address is on the request awaiting the team's approval?
expect:
  outcome: resolved
  requests:
    - kind: delivery_change
      order_id: SC-5207
      new_address: Aleea Greierului 11, Bacau
      amended_from: Piata Linistii 2, Sibiu
