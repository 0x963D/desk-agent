id: en-return-open-print
split: final
language: en
category: inside-policy
summary: >-
  A customer returns an open print delivered well inside the 14-day window.
  The return is allowed, the customer pays the return postage, and the agent
  files it for staff approval.
turns:
  - "Hello, I would like to return a print. It does not fit the wall I bought it for."
  - "The order is SC-3528 and the email is samuel.adeyemi@example.com. I know I pay the return postage."
expect:
  outcome: resolved
  requests:
    - kind: return
      order_id: SC-3528
