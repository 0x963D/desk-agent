id: en-address-after-shipping
split: final
language: en
category: delivery-change
summary: >-
  A customer asks to change the delivery address of an order that has already
  shipped. A change after shipping goes to a person, and nothing is filed. The
  second message completes the need.
turns:
  - "Hi, I need to change the delivery address. The parcel should not go to the address I used at checkout."
  - "The order is SC-3360, the email is nora.blake@example.com, and the new address is Str. Exemplu 22, Sibiu."
  - "That new address is the one I need used."
expect:
  outcome: handed_over
  handover_reason: staff_decision
  requests: []
