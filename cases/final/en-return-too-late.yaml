id: en-return-too-late
split: final
language: en
category: outside-policy
summary: A verified customer asks to return an open print delivered sixteen days ago. Day 14 is the last day inside the window, so the agent refuses the return and files nothing.
turns:
  - Hello. I want to return order SC-5214. The email is kaelis.draganut@example.com.
  - It was delivered earlier this month. The colour is not what I expected.
  - I can pay the postage. Please file the return anyway.
expect:
  outcome: refused
