id: ro-portret-la-comanda
split: final
language: ro
category: person-needed
summary: A customer asks for a commissioned portrait and gives the idea, the size, the placement and when they are free. The chat gives no price and no date, so the agent hands the inquiry to the artist.
turns:
  - Bună ziua. Aș vrea o lucrare la comandă, un portret, nu un print din catalog.
  - I want it large, about 50 by 70 centimetres, of my grandfather reading by a window. That is the idea and the size.
  - Revin în română. Așezarea ar fi pe peretele din fața canapelei, iar sunt liberă în serile de joi.
  - Nu îmi spuneți un preț și nici o dată. Vreau ca artista să vadă ideea, mărimea, locul și când sunt liberă.
  - Nu este un tatuaj și nu este o comandă deja plătită. Este doar întrebarea pentru un portret.
  - Dacă trebuie să vorbească artista, sunt de acord. Eu nu mai adaug alte detalii.
  - Mulțumesc. Asta este tot ce am despre portret.
expect:
  outcome: handed_over
  handover_reason: commission_or_booking
