id: en-framing-timing-and-damage
split: tuning
language: en
category: damage
summary: >-
  A customer asks for print framing advice, reports damage on a recent delivery, checks delivery
  times to another European country, and returns to complete a damage claim requesting a reprint.
  The claim is reported within 14 days of delivery, so the agent files the damage claim with the reprint remedy.
turns:
  - Hi there! I had a quick question first about caring for your prints. Do you recommend UV protective glass for framing?
  - Thanks, that makes sense. The reason I am asking is because my print arrived with damage yesterday. The postal tube was crushed and there is a crease right across the artwork.
  - The order number is SC-2530. But before we finish that, how long does delivery take to other EU countries like Ireland? I want to buy a gift for a friend.
  - Good to know, 5 to 8 working days gives me enough time. Now going back to SC-2530 and the damaged print.
  - My email address is claire.davies@example.com. I really love the art itself and I would definitely prefer a reprint rather than a refund.
  - I have taken photos of the tube and the crease. Please go ahead and file the damage claim for the reprint.
expect:
  outcome: resolved
  requests:
    - kind: damage
      order_id: SC-2530
      remedy: reprint
