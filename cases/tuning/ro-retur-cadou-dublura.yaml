id: ro-retur-cadou-dublura
split: tuning
language: ro
category: inside-policy
summary: >-
  A verified customer returns an open print because the friend she bought it
  for already owns it. It was delivered nine days ago, inside the 14-day
  window, and costs 290 lei, so the agent files a return for staff approval.
turns:
  - "Buna ziua, am primit saptamana trecuta un print de la voi si as vrea sa il returnez. L-am luat cadou pt o prietena si ea il are deja :("
  - nr comenzii e SC-1264, mail carmen.nistor@example.com. E nedesfacut, in tubul in care a venit. Cum procedez?
expect:
  outcome: resolved
  requests:
    - kind: return
      order_id: SC-1264
