id: en-when-will-it-arrive
split: tuning
language: en
category: order-status
summary: >-
  A verified customer in the Netherlands asks when an order placed three
  working days ago will arrive. The order is in production, so the agent says
  so and gives the policy times: 3 to 5 working days to make it, then 5 to 8
  working days to another EU country. Nothing is filed.
turns:
  - Hi there! I ordered two prints on Tuesday, order SC-1334, email jasper.hendriks@example.com. They're going to Utrecht. Any idea when they'll get here?
  - A rough estimate is fine, I just want to make sure someone's home to sign for them.
expect:
  outcome: resolved
  requests: []
