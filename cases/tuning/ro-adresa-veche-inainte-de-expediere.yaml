id: ro-adresa-veche-inainte-de-expediere
split: tuning
language: ro
category: delivery-change
summary: >-
  A verified customer left her old address on an order that is still in
  production. A delivery change is possible until the order ships, so the
  agent files one with the new address and says that staff must approve it.
turns:
  - "Bună! Am comandat marți un print (AM-1338) și abia acum am văzut că am lăsat adresa veche la livrare, eu m-am mutat luna trecută :)) Se mai poate schimba?"
  - Mailul de pe comandă e ioana.capraru@example.com. Adresa nouă e Str. Vulpii Argintii 12, Oradea. Restul rămâne la fel.
expect:
  outcome: resolved
  requests:
    - kind: delivery_change
      order_id: AM-1338
      new_address: Str. Vulpii Argintii 12, Oradea
