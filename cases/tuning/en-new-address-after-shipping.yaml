id: en-new-address-after-shipping
split: tuning
language: en
category: delivery-change
summary: >-
  A verified customer wants her parcel sent to her office instead of her home.
  She starts in English and switches to Romanian in the second turn. The order
  has already shipped, so the agent files nothing and hands over to a person.
turns:
  - Hello, I need to change the delivery address on my order, I won't be home this week. Order SC-1316, raluca.tanase@example.com
  - "A, stai, văd că sunteți din București, atunci scriu în română :) Aș vrea să vină coletul la birou, nu acasă. Adresa de la birou e Str. Lunii Pline 30, Cluj-Napoca."
  - Se poate rezolva? Dacă vine acasă, curierul n-are cui să-l lase.
expect:
  outcome: handed_over
  handover_reason: staff_decision
  requests: []
