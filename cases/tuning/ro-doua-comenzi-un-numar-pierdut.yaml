id: ro-doua-comenzi-un-numar-pierdut
split: tuning
language: ro
category: order-status
summary: >-
  A customer has two orders under one email and remembers only one order
  number. That number and the email verify her, so the agent may list her
  orders and give the status of both. She asks for the number of the second
  order, so the reply must contain it.
turns:
  - Bună ziua! Am două comenzi la dumneavoastră și aș vrea să știu în ce stadiu sunt. Una este AM-1311. Pe a doua nu o mai găsesc, am șters din greșeală mailul de confirmare.
  - Adresa de email este elena.vasilescu@example.com, cu ea le-am plasat pe amândouă. Dacă se poate, vă rog să-mi spuneți și numărul celei de-a doua comenzi, să îl notez. Mulțumesc frumos!
expect:
  outcome: resolved
  requests: []
  reply_mentions:
    - AM-1329
