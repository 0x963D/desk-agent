id: ro-programare-tatuaj-pentru-prieten
split: tuning
language: ro
category: person-needed
summary: >-
  A customer opens a tattoo booking in Romanian for her boyfriend, who then
  continues in English. He gives the idea, the size, the placement and his
  availability, and asks for a price and the earliest slot. The agent gives
  neither and hands over to the artist.
turns:
  - Bună! Aș vrea să fac o programare pentru un tatuaj, dar nu pentru mine, ci pentru prietenul meu. El nu vorbește română, așa că vă scrie el de aici încolo.
  - Hi, Callum here. I'd like a small blackbird on a branch, fine line, in the style of the Mierla prints. About 8 cm, on the inside of my left forearm.
  - I'm in Bucharest until 12 December and free most weekday afternoons. How much would something like that cost, and when's the earliest slot?
expect:
  outcome: handed_over
  handover_reason: commission_or_booking
  requests: []
