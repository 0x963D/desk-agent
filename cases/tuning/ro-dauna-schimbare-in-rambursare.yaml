id: ro-dauna-schimbare-in-rambursare
split: tuning
language: ro
category: damage
summary: >-
  A verified customer reports a damaged print and initially requests a reprint, which the agent files.
  The customer then asks to amend the request to a refund instead.
  Because the total is 340 lei (under the 1,000 lei limit), the policy allows the amendment and the agent updates the remedy.
turns:
  - Bună ziua. Am primit comanda SC-2540 cu printul zgâriat pe mijloc. Emailul meu este mihai.stoica@example.com. Aș dori o retipărire, vă rog.
  - M-am răzgândit între timp. Pentru că reamenajez camera, aș prefera totuși rambursarea banilor pe card în loc de retipărire, dacă se poate schimba cererea.
  - Mulțumesc mult pentru ajutor, am pregătit deja fotografiile pentru echipa dumneavoastră.
expect:
  outcome: resolved
  requests:
    - kind: damage
      order_id: SC-2540
      remedy: refund
      amended_from: reprint
