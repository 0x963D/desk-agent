id: en-damage-amend-large-refund
split: tuning
language: en
category: outside-policy
summary: >-
  A verified customer reports damage on a 1,350 lei limited print and requests a reprint, which the agent files.
  The customer then asks to amend the claim to a refund instead.
  Because a person must decide any refund above 1,000 lei, the policy refuses the agent amendment and the conversation is handed over to staff.
turns:
  - Hello, my limited edition print SC-2550 arrived with a torn edge on the margin. My email is marcus.vance@example.com. I would love a replacement reprint since it is an amazing print.
  - Actually, looking at my schedule I will be moving out next month, so I would like to change my request from a reprint to a full refund to my card instead.
  - Thank you, please let me know what the team needs from me to approve this refund.
expect:
  outcome: handed_over
  handover_reason: staff_decision
  requests:
    - kind: damage
      order_id: SC-2550
      remedy: reprint
