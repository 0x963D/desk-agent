id: en-cancel-wrong-size
split: tuning
language: en
category: inside-policy
summary: >-
  A verified customer cancels an order placed the day before. The order is
  paid and production has not started, so the agent files a cancellation and
  says that staff must approve the refund. The total is 470 lei, well under
  the large-refund limit.
turns:
  - Hi, I placed an order yesterday and I need to cancel it. I picked the wrong size for both prints, sorry about that!
  - It's AM-1349 and the email is tomas.herrera@example.com. Will I get my money back?
expect:
  outcome: resolved
  requests:
    - kind: cancellation
      order_id: AM-1349
