id: ro-retur-si-intrebare-livrare
split: tuning
language: ro
category: inside-policy
summary: >-
  A verified customer wants to return an open print received five days ago, pauses to ask
  how long delivery to Germany takes for a gift, and then returns to complete the return request.
  The return is inside the 14-day window, so the agent files the return for staff approval.
turns:
  - salut, am primit saptamana trecuta un print si as vrea sa fac retur pentru ca nu se potriveste deloc pe perete
  - inainte de asta, voiam sa intreb cat dureaza livrarea daca as comanda un print pentru o prietena din Germania, pentru un cadou
  - am inteles, multumesc, o sa ma mai gandesc la cadou
  - revenind la printul meu primit, comanda este SC-2520 si vreau sa merg mai departe cu returul
  - adresa mea de email este andreea.marinescu@example.com, cu ea am facut comanda pe site
  - este totul in regula, va rog sa inregistrati cererea de retur pentru aceasta comanda
expect:
  outcome: resolved
  requests:
    - kind: return
      order_id: SC-2520
