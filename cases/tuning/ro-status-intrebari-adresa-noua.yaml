id: ro-status-intrebari-adresa-noua
split: tuning
language: ro
category: delivery-change
summary: >-
  A verified customer checks the status of an order currently in production, asks about
  payment and return policies, and then returns to the order to update the delivery address.
  Because the order has not yet shipped, the agent files the delivery address change for staff approval.
turns:
  - Bună ziua! Am plasat o comandă acum câteva zile și aș dori să știu când este estimată livrarea.
  - Comanda este SC-2510, iar adresa mea de email este vlad.popescu@example.com.
  - Am înțeles, mulțumesc frumos. Aș dori să știu dacă la următoarea comandă pot alege plata ramburs, sau este doar cu cardul?
  - "Mulțumesc pentru lămurire. Mai aveam o întrebare: printurile din catalog se pot returna dacă nu se potrivește culoarea?"
  - Revenind la comanda SC-2510 de care am întrebat la început, aș dori să schimb adresa de livrare înainte să fie expediată.
  - Noua adresă de livrare este Str. Castanilor 14, Brașov. Se poate înregistra această modificare?
expect:
  outcome: resolved
  requests:
    - kind: delivery_change
      order_id: SC-2510
      new_address: Str. Castanilor 14, Brașov
