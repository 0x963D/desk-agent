# docker compose run --rm check
# Builds the image from this checkout, then runs the typecheck, the tests, the offline tuning replay and the report.
name: desk-agent
services:
  check:
    build: .
    # Build again on every run, so the image never lags behind the checkout.
    pull_policy: build
    # The run itself has no network: no key, no provider call, no registry.
    network_mode: none
