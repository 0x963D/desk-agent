# Atelier Mierla, the invented print shop in docs/scope.md. Both splits share this file.
business_date: 2026-11-20
return_window_days: 14
damage_window_days: 14
person_decides_refunds_above_ron: 1000

rules:
  production:
    ro: Fiecare print este realizat la comandă în 3–5 zile lucrătoare.
    en: Each print is made to order in 3 to 5 working days.
  delivery:
    ro: Livrarea durează 1–2 zile lucrătoare în România și 5–8 zile lucrătoare în celelalte țări din Uniunea Europeană.
    en: Delivery takes 1 to 2 working days in Romania and 5 to 8 working days in other EU countries.
  payment:
    ro: Plata se face doar cu cardul. Magazinul nu oferă plata ramburs.
    en: Payment is by card only. The shop does not offer cash on delivery.
  delivery_change:
    ro: Adresa de livrare se poate schimba până la expedierea comenzii. Schimbarea trebuie aprobată de echipă.
    en: The delivery address can change until the order ships. Staff must approve the change.
  cancellation:
    ro: O comandă se poate anula cât timp este plătită și producția nu a început. Rambursarea trebuie aprobată de echipă.
    en: An order can be cancelled while it is paid and production has not started. Staff must approve the refund.
  return:
    ro: Printurile din catalog se pot returna în 14 zile de la livrare. Clientul plătește transportul retur. Rambursarea trebuie aprobată de echipă.
    en: Catalogue prints can be returned within 14 days of delivery. The customer pays the return postage. Staff must approve the refund.
  damage:
    ro: Un print deteriorat sau tipărit greșit se semnalează în 14 zile de la livrare. Clientul primește o retipărire sau banii înapoi. Echipa cere o fotografie și aprobă soluția.
    en: Report a damaged or misprinted print within 14 days of delivery. The customer gets a reprint or a refund. Staff ask for a photo and approve.
  large_refund:
    ro: Orice rambursare de peste 1.000 de lei o decide o persoană din echipă.
    en: A person on the team decides any refund above 1,000 lei.
  commissioned_work:
    ro: Lucrările realizate la comandă specială nu se pot returna.
    en: Commissioned work is not returnable.
  limited_drops:
    ro: Printurile din edițiile limitate nu se mai produc și nu se pot rezerva.
    en: Limited-drop prints are never restocked and cannot be reserved.
  commissions_and_bookings:
    ro: Lucrările la comandă și programările pentru tatuaje le discută artista personal. Prin chat nu oferim prețuri și nici date.
    en: The artist answers commission and tattoo booking inquiries in person. The chat gives no price and no date.
  health:
    ro: Nu oferim sfaturi medicale. Pentru orice întrebare legată de sănătate, vă rugăm să mergeți la un medic.
    en: The shop gives no medical advice. For any health question, please see a doctor.
